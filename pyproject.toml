[tool.poetry]
name = "kwork"
version = "0.1.0"
description = "ML-модель предсказания цен на квартиры в Москве с автоматическим сбором данных"
authors = ["shq_shq"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
slowapi = "^0.1.9"

# Database
sqlalchemy = "^2.0.27"
asyncpg = "^0.29.0"
alembic = "^1.13.1"

# ML
pandas = "^2.2.1"
scikit-learn = "^1.4.1"
catboost = "^1.2.3"
optuna = "^3.6.0"
joblib = "^1.3.2"

# Ingestion
playwright = "^1.41.0"
beautifulsoup4 = "^4.12.3"
tenacity = "^8.2.3"
fake-useragent = "^1.5.0"

# Logging
structlog = "^24.1.0"

# Frontend
streamlit = "^1.31.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.2.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
httpx = "^0.27.0"
pytest-cov = "^5.0.0"
aiosqlite = "^0.20.0"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# X_train / X_test — общепринятое соглашение sklearn/CatBoost, переименование ухудшает читаемость
"src/training/*.py" = ["N803", "N806"]
"tests/*.py" = ["N803", "N806"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Header() в значениях по умолчанию — штатный приём FastAPI, а не ошибка B008
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
